<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Login — Students' Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/images/logo-mark.png">
<style>
:root{--navy:#182238;--teal:#04a5a7;--line:#e5eaf0;--muted:#718096}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(140deg,#103a52,var(--navy));font-family:Inter,sans-serif;color:#263248}.card{width:min(420px,100%);background:#fff;border-radius:18px;padding:32px;box-shadow:0 22px 70px #0004}.mascot{text-align:center}.mascot img{width:62px;height:62px;object-fit:contain}.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:4px 0 3px}.brand img{width:38px;height:38px;object-fit:contain}.brand strong{font:800 21px 'Baloo 2',sans-serif;color:var(--navy)}.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 25px}.field{display:block;margin:14px 0;font-size:12px;font-weight:700;color:#34445e}.field input{display:block;width:100%;height:46px;margin-top:7px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:500 14px Inter,sans-serif}.field input:focus{outline:3px solid #04a5a720;border-color:var(--teal)}button{width:100%;height:46px;border:0;border-radius:8px;background:var(--teal);color:#fff;font:700 14px Inter,sans-serif;cursor:pointer;margin-top:8px}button:disabled{opacity:.55;cursor:wait}.error{display:none;background:#fff0f2;color:#a42a4c;padding:10px 12px;border-radius:8px;font-size:12px;margin:14px 0}.error.show{display:block}.links{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}.links a{color:#047c7f;font-weight:700;text-decoration:none}.hint{color:var(--muted);font-size:11px;line-height:1.5;margin:15px 0 0}
</style>
</head>
<body>
<main class="card">
  <div class="mascot"><img src="/images/mascot-main.png" alt="Nubo"></div>
  <div class="brand"><img src="/images/logo-mark.png" alt=""><strong>Students' Home</strong></div>
  <p class="sub">Teacher Portal · Secure Sign In</p>
  <form id="login-form">
    <label class="field">Teacher Code<input id="teacher-code" autocomplete="username" required autofocus placeholder="Enter your Teacher Code"></label>
    <label class="field">Password<input id="password" type="password" autocomplete="current-password" required placeholder="Enter your password"></label>
    <div id="error" class="error" role="alert"></div>
    <button id="submit" type="submit">Sign In to Teacher Portal</button>
  </form>
  <p class="hint">Use the Teacher Code and temporary password provided by the Admin. You will be asked to create a private password on your first sign-in.</p>
  <div class="links"><a href="/login.html">Admin Portal</a> &nbsp;·&nbsp; <a href="/parent-login.html">Parent Portal</a></div>
</main>
<script>
const form=document.getElementById('login-form'),err=document.getElementById('error'),btn=document.getElementById('submit');
async function init(){try{const r=await fetch('/api/teacher-auth/status');const s=await r.json();if(s.loggedIn){location.replace('/teacher-portal.html');}}catch(e){}}
form.addEventListener('submit',async e=>{e.preventDefault();err.classList.remove('show');btn.disabled=true;btn.textContent='Signing in…';try{const r=await fetch('/api/teacher-auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({teacher_code:document.getElementById('teacher-code').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not sign in.');location.replace('/teacher-portal.html');}catch(ex){err.textContent=ex.message;err.classList.add('show');btn.disabled=false;btn.textContent='Sign In to Teacher Portal';}});init();
</script>
</body></html>
