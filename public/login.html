<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Students' Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/images/logo-mark.png" />
<style>
  :root {
    --navy: #182238;
    --teal: #04A5A7;
    --teal-deep: #04807F;
    --pink: #DE306F;
    --line: #E6E8F0;
    --text: #262B38;
    --text-mute: #6B7284;
    --bg: #F5F6FA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #103A52, var(--navy));
    font-family: 'Inter', sans-serif;
    color: var(--text);
  }
  .card {
    width: 380px;
    max-width: 92vw;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    padding: 34px 32px 30px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .brand img { width: 38px; height: 38px; object-fit: contain; }
  .brand .name { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; color: var(--navy); }
  .subtitle { font-size: 13px; color: var(--text-mute); margin: 0 0 24px; min-height: 1.3em; }
  .mascot-row { display: flex; justify-content: center; margin-bottom: 8px; }
  .mascot-row img { width: 56px; height: 56px; object-fit: contain; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: #2A3B5C; margin-bottom: 6px; }
  input {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
  .field-hint { font-size: 11px; color: var(--text-mute); margin: -12px 0 16px; }
  .btn {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 11px;
    border: none;
    border-radius: 6px;
    background: var(--teal);
    color: #fff;
    cursor: pointer;
    margin-top: 4px;
  }
  .btn:hover { background: var(--teal-deep); }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .error {
    display: none;
    color: #921C42;
    background: rgba(222,48,111,0.1);
    border: 1px solid rgba(222,48,111,0.35);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 14px;
  }
  .error.shown { display: block; }
  .footer-note { text-align: center; font-size: 11px; color: var(--text-mute); margin-top: 18px; }
  .loading-note { text-align: center; font-size: 13px; color: var(--text-mute); padding: 20px 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="mascot-row"><img src="/images/mascot-main.png" alt="Nubo" /></div>
    <div class="brand">
      <img src="/images/logo-mark.png" alt="Students' Home" />
      <span class="name">Students' Home</span>
    </div>
    <p class="subtitle" id="subtitle">Checking…</p>

    <p class="loading-note" id="loading-note">One moment…</p>

    <form id="auth-form" style="display:none;">
      <label for="f-username" id="username-label">Username</label>
      <input type="text" id="f-username" autocomplete="username" required />

      <label for="f-password" id="password-label">Password</label>
      <input type="password" id="f-password" autocomplete="current-password" required />
      <p class="field-hint" id="password-hint" style="display:none;">At least 6 characters.</p>

      <div class="error" id="error-msg"></div>
      <button type="submit" class="btn" id="submit-btn">Sign In</button>
    </form>
    <p class="footer-note">Students' Home &middot; Kottakkal</p>
  </div>

<script>
const form = document.getElementById('auth-form');
const loadingNote = document.getElementById('loading-note');
const errorMsg = document.getElementById('error-msg');
const submitBtn = document.getElementById('submit-btn');
const subtitle = document.getElementById('subtitle');
const usernameLabel = document.getElementById('username-label');
const passwordHint = document.getElementById('password-hint');
let isSetup = false;

function showError(message) {
  errorMsg.textContent = message;
  errorMsg.classList.add('shown');
}
function clearError() {
  errorMsg.textContent = '';
  errorMsg.classList.remove('shown');
}

async function init() {
  try {
    const res = await fetch('/api/auth/status');
    if (!res.ok) throw new Error('status ' + res.status);
    const status = await res.json();
    if (status.loggedIn) {
      location.href = '/';
      return;
    }
    isSetup = !!status.setupNeeded;
    if (isSetup) {
      subtitle.textContent = 'First time here — create the administrator account.';
      usernameLabel.textContent = 'Choose a Username';
      submitBtn.textContent = 'Create Account & Sign In';
      passwordHint.style.display = 'block';
    } else {
      subtitle.textContent = 'Institution Manager — sign in to continue.';
      usernameLabel.textContent = 'Username';
      submitBtn.textContent = 'Sign In';
      passwordHint.style.display = 'none';
    }
    loadingNote.style.display = 'none';
    form.style.display = 'block';
  } catch (err) {
    loadingNote.style.display = 'none';
    form.style.display = 'block';
    showError('Could not reach the server. Check that it is running, then reload this page.');
  }
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  clearError();
  submitBtn.disabled = true;
  submitBtn.textContent = isSetup ? 'Creating account…' : 'Signing in…';

  const username = document.getElementById('f-username').value.trim();
  const password = document.getElementById('f-password').value;

  if (!username) {
    showError('Enter a username.');
    submitBtn.disabled = false;
    submitBtn.textContent = isSetup ? 'Create Account & Sign In' : 'Sign In';
    return;
  }
  if (isSetup && password.length < 6) {
    showError('Password must be at least 6 characters.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Create Account & Sign In';
    return;
  }

  try {
    const endpoint = isSetup ? '/api/auth/setup' : '/api/auth/login';
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    let data = {};
    try { data = await res.json(); } catch (e2) { /* no body */ }
    if (!res.ok) throw new Error(data.error || ('Request failed (' + res.status + ')'));
    location.href = '/';
  } catch (err) {
    showError(err.message);
    submitBtn.disabled = false;
    submitBtn.textContent = isSetup ? 'Create Account & Sign In' : 'Sign In';
  }
});

init();
</script>
</body>
</html>
