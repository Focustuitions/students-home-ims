<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Student Progress Report — Students' Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/images/logo-mark.png" />
<style>
  :root { --navy:#182238; --teal:#04807F; --line:#E5E8EF; --text:#262B38; --mute:#687184; --bg:#F4F6FA; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,sans-serif; }
  .toolbar { max-width:210mm; margin:22px auto 12px; padding:0 12px; display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .toolbar p { margin:0; color:var(--mute); font-size:12px; line-height:1.5; }
  .actions { display:flex; gap:8px; flex-shrink:0; }
  .btn { border:1px solid var(--navy); border-radius:7px; padding:10px 13px; background:var(--navy); color:#fff; font:700 12px Inter,sans-serif; cursor:pointer; }
  .btn.secondary { background:#fff; color:var(--navy); }
  .sheet { width:210mm; min-height:297mm; margin:0 auto 30px; padding:15mm 15mm 13mm; background:#fff; box-shadow:0 5px 25px rgba(24,34,56,.09); }
  .report-header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:7mm; border-bottom:2px solid var(--navy); }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand img { width:45px; height:45px; object-fit:contain; }
  .brand-name { font:800 19px 'Baloo 2',sans-serif; color:var(--navy); line-height:1; }
  .brand-sub { margin-top:4px; color:var(--mute); font-size:9px; }
  .report-label { text-align:right; color:var(--teal); font-size:9px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase; }
  h1 { margin:3px 0 0; color:var(--navy); font:800 24px 'Baloo 2',sans-serif; }
  .student-strip { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px; margin:7mm 0; padding:4mm; background:#F5F7FA; border:1px solid var(--line); border-radius:7px; }
  .meta-label { margin-bottom:3px; color:var(--mute); font-size:8px; text-transform:uppercase; letter-spacing:.6px; font-weight:700; }
  .meta-value { color:var(--navy); font-size:11px; font-weight:700; overflow-wrap:anywhere; }
  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:7mm; }
  .summary-item { padding:3mm; background:#fff; border:1px solid var(--line); border-radius:6px; }
  .summary-item .n { color:var(--navy); font:800 19px 'Baloo 2',sans-serif; }
  .summary-item .l { color:var(--mute); font-size:8px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
  .section { margin-top:7mm; break-inside:auto; }
  .section h2 { margin:0 0 3mm; padding-bottom:2mm; border-bottom:1px solid var(--navy); color:var(--navy); font:800 16px 'Baloo 2',sans-serif; }
  .section-note { margin:-1mm 0 3mm; color:var(--mute); font-size:9px; }
  table { width:100%; border-collapse:collapse; font-size:9px; }
  thead { display:table-header-group; }
  th { padding:2.2mm 2mm; background:#F0F3F7; color:var(--navy); border-bottom:1px solid #CDD3DE; text-align:left; font-size:8px; text-transform:uppercase; letter-spacing:.35px; }
  td { padding:2mm; border-bottom:1px solid var(--line); vertical-align:top; }
  tr { break-inside:avoid; page-break-inside:avoid; }
  .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .empty { padding:5mm 3mm; border:1px dashed #CDD3DE; border-radius:6px; text-align:center; color:var(--mute); font-size:10px; }
  .observation { padding:3mm 0; border-bottom:1px solid var(--line); }
  .observation:last-child { border-bottom:0; }
  .obs-meta { display:flex; flex-wrap:wrap; gap:8px; color:var(--mute); font-size:8px; margin-bottom:1mm; }
  .obs-performance { color:var(--navy); font-size:10px; font-weight:700; }
  .obs-checks { margin-top:1mm; color:var(--mute); font-size:8px; }
  .footer { margin-top:10mm; padding-top:3mm; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; color:var(--mute); font-size:8px; }
  .error { max-width:650px; margin:60px auto; padding:20px; color:#921C42; background:#FFF5F8; border:1px solid #F1CAD7; border-radius:9px; font-size:13px; line-height:1.6; }
  @media(max-width:760px) {
    .toolbar { align-items:flex-start; flex-direction:column; }
    .actions { width:100%; }
    .btn { flex:1; }
    .sheet { width:100%; min-height:0; margin:0; padding:22px 15px; overflow:hidden; }
    .student-strip { grid-template-columns:1fr 1fr; }
    .student-strip > :first-child { grid-column:1 / -1; }
    .brand-name { font-size:17px; }
    h1 { font-size:20px; }
    .table-scroll { overflow-x:auto; }
    table { min-width:620px; }
  }
  @media print {
    body { background:#fff; }
    .toolbar { display:none !important; }
    .sheet { width:auto; min-height:0; margin:0; padding:0; box-shadow:none; }
    @page { size:A4; margin:12mm; }
    .section h2 { break-after:avoid; page-break-after:avoid; }
  }
</style>
</head>
<body>
<div class="toolbar no-print">
  <p id="toolbar-message">Preparing your child's progress report…<br>Use “Download / Save as PDF” and select “Save as PDF” in the print window.</p>
  <div class="actions">
    <button class="btn secondary" type="button" onclick="location.href='/parent.html'">Back to Portal</button>
    <button class="btn" id="download-btn" type="button" disabled>Download / Save as PDF</button>
  </div>
</div>
<div id="report-root" class="sheet">
  <div style="padding:70px 10px;text-align:center;color:#687184;font-size:13px;">Loading your child's progress report…</div>
</div>
<script>
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date = value => value ? esc(value) : '—';
const marks = row => row.is_absent ? 'Absent' : (row.marks == null ? '—' : `${esc(row.marks)} / ${esc(row.max_marks)}`);
const percentage = row => {
  if (row.is_absent || row.marks == null || !Number(row.max_marks)) return '—';
  return `${(Number(row.marks) * 100 / Number(row.max_marks)).toFixed(1)}%`;
};
function empty(message) { return `<div class="empty">${esc(message)}</div>`; }
function makeTable(headers, rows, emptyMessage) {
  if (!rows.length) return empty(emptyMessage);
  return `<div class="table-scroll"><table><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function render(data) {
  const student = data.student || {};
  const weekly = Array.isArray(data.weeklyTests) ? data.weeklyTests : [];
  const term = Array.isArray(data.termExams) ? data.termExams : [];
  const observations = Array.isArray(data.observations) ? data.observations : [];
  const weeklyRows = weekly.map(t => `<tr>
    <td>${date(t.test_date)}</td><td>${esc(t.exam_name || '—')}</td>
    <td>${esc(t.subject || '—')}</td><td>${esc(t.topic || '—')}</td>
    <td class="num">${marks(t)}</td><td class="num">${percentage(t)}</td>
  </tr>`);
  const termRows = term.map(t => `<tr>
    <td>${date(t.exam_date)}</td><td>${esc(t.exam_name || '—')}</td>
    <td>${esc(t.subject || '—')}</td><td class="num">${marks(t)}</td>
    <td class="num">${percentage(t)}</td>
  </tr>`);
  const observationBlocks = observations.map(o => {
    const checks = [];
    if (o.notes_completed) checks.push('Notes complete');
    if (o.notebook_neat) checks.push('Notebook neat');
    if (o.questions_answered) checks.push('Answered questions');
    if (o.good_attention_span) checks.push('Good attention');
    if (o.no_notebook) checks.push('No notebook');
    if (o.no_textbook) checks.push('No textbook');
    return `<div class="observation">
      <div class="obs-meta"><span>${date(o.date)}</span><span>${esc(o.subject || 'General')}</span></div>
      <div class="obs-performance">${esc(o.performance || 'Observation recorded')}</div>
      <div class="obs-checks">${esc(checks.join(' · ') || 'No checklist details')}</div>
    </div>`;
  }).join('');
  const generated = new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  document.getElementById('report-root').innerHTML = `
    <div class="report-header">
      <div class="brand"><img src="/images/logo-mark.png" alt="Students' Home"><div><div class="brand-name">Students' Home</div><div class="brand-sub">Kottakkal · Academic Progress</div></div></div>
      <div class="report-label">Student Progress Report<h1>Academic Record</h1></div>
    </div>
    <div class="student-strip">
      <div><div class="meta-label">Student Name</div><div class="meta-value">${esc(student.name || '—')}</div></div>
      <div><div class="meta-label">Admission Number</div><div class="meta-value">${esc(student.admission_no || '—')}</div></div>
      <div><div class="meta-label">Class & Division</div><div class="meta-value">${esc([student.class, student.division].filter(Boolean).join(' - ') || '—')}</div></div>
    </div>
    <div class="summary">
      <div class="summary-item"><div class="n">${weekly.length}</div><div class="l">Weekly Test Entries</div></div>
      <div class="summary-item"><div class="n">${term.length}</div><div class="l">Term Exam Subjects</div></div>
      <div class="summary-item"><div class="n">${observations.length}</div><div class="l">Teacher Observations</div></div>
    </div>
    <section class="section">
      <h2>1. Weekly Tests</h2>
      <p class="section-note">Test-wise marks and percentages recorded for the student.</p>
      ${makeTable(['Date','Test','Subject','Topic','Marks','Percentage'], weeklyRows, 'No weekly test results are available yet.')}
    </section>
    <section class="section">
      <h2>2. Term Examination Reports</h2>
      <p class="section-note">Subject-wise marks and percentages recorded for term examinations.</p>
      ${makeTable(['Date','Examination','Subject','Marks','Percentage'], termRows, 'No term examination results are available yet.')}
    </section>
    <section class="section">
      <h2>3. Teacher Observations</h2>
      ${observationBlocks || empty('No teacher observations have been recorded yet.')}
    </section>
    <div class="footer"><span>Students' Home · Kottakkal</span><span>Generated on ${generated}</span></div>`;
  document.getElementById('toolbar-message').innerHTML = `Progress report for <strong>${esc(student.name || 'your child')}</strong> is ready.<br>Choose “Download / Save as PDF”, then select “Save as PDF” in the print window.`;
  document.getElementById('download-btn').disabled = false;
  document.title = `${student.name || 'Student'} - Progress Report`;
}
async function loadReport() {
  try {
    const response = await fetch('/api/parents/dashboard', { cache:'no-store', credentials:'same-origin' });
    const data = await response.json().catch(() => ({}));
    if (response.status === 401) { location.replace('/parent-login.html'); return; }
    if (response.status === 403 && data.mustChangePassword) { location.replace('/parent.html'); return; }
    if (!response.ok) throw new Error(data.error || 'Unable to load the progress report.');
    render(data);
  } catch (error) {
    document.getElementById('report-root').innerHTML = `<div class="error">${esc(error.message || 'Unable to load the progress report.')}<br><a href="/parent.html">Return to Parent Portal</a></div>`;
    document.getElementById('toolbar-message').textContent = 'The progress report could not be loaded.';
  }
}
document.getElementById('download-btn').addEventListener('click', () => window.print());
loadReport();
</script>
</body>
</html>
