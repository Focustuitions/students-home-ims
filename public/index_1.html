<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students' Home &mdash; Institution Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" type="image/png" href="/images/logo-mark.png" />
</head>
<body>

<div class="app">
  <aside class="spine">
    <div class="spine-brand">
      <img src="/images/logo-mark.png" alt="Students' Home logo" class="brand-logo" />
      <div class="brand-text">
        <span class="brand-title">Students' Home</span>
        <span class="brand-sub">Kottakkal · Institution Manager</span>
      </div>
    </div>
    <div class="spine-year">
      <label for="year-switcher">Academic Year</label>
      <div class="spine-year-row">
        <select id="year-switcher"></select>
        <button type="button" id="add-year-btn" title="Add Academic Year">+</button>
      </div>
    </div>
    <nav class="tabs" id="nav-tabs">
      <button class="tab" data-route="dashboard"><span class="tab-idx">01</span>Dashboard</button>
      <button class="tab" data-route="students"><span class="tab-idx">02</span>Students</button>
      <button class="tab" data-route="withdrawn-students"><span class="tab-idx">03</span>Left / Withdrawn</button>
      <button class="tab" data-route="add-student"><span class="tab-idx">04</span>Admit Student</button>
      <button class="tab" data-route="payment"><span class="tab-idx">05</span>Fee Payment</button>
      <button class="tab" data-route="fee-pending-slips"><span class="tab-idx">06</span>Fee Pending Slips</button>
      <button class="tab" data-route="payment-history"><span class="tab-idx">07</span>Payment History</button>
      <button class="tab" data-route="classes"><span class="tab-idx">08</span>Classes</button>
      <button class="tab" data-route="teachers"><span class="tab-idx">09</span>Teachers</button>
      <button class="tab" data-route="timetable"><span class="tab-idx">10</span>Timetable</button>
      <button class="tab" data-route="mark-entry"><span class="tab-idx">11</span>Mark Entry</button>
      <button class="tab" data-route="assignments"><span class="tab-idx">12</span>Impositions &amp; Assignments</button>
      <button class="tab" data-route="weekly-tests"><span class="tab-idx">13</span>Weekly Tests</button>
      <button class="tab" data-route="term-exams"><span class="tab-idx">14</span>Term Exams</button>
      <button class="tab" data-route="hot-seat"><span class="tab-idx">15</span>Hot Seat</button>
      <button class="tab" data-route="import"><span class="tab-idx">16</span>Import Data</button>
    </nav>
    <div class="spine-mascot">
      <img src="/images/mascot-main.png" alt="Nubo the Book Sprite" />
      <p><strong>Nubo says:</strong> Learn today, lead tomorrow!</p>
    </div>
    <div class="spine-foot">
      <span id="clock"></span>
      <div class="spine-account">
        <span>Signed in as <strong id="logged-in-as">—</strong></span>
        <div style="display:flex;gap:6px;">
          <button type="button" id="change-password-btn">Change Password</button>
          <button type="button" id="logout-btn">Log Out</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="ledger">
    <div id="toast" class="toast"></div>
    <div id="view"></div>
  </main>
</div>

<template id="tpl-dashboard">
  <div class="welcome-banner">
    <img src="/images/mascot-main.png" alt="Nubo" />
    <div class="wb-text">
      <h3 id="wb-greeting">Welcome back!</h3>
      <p>Here's how Students' Home is doing today.</p>
    </div>
  </div>
  <header class="page-head">
    <div>
      <p class="eyebrow">Overview</p>
      <h1>Today's Standing</h1>
    </div>
  </header>
  <div class="stat-row" id="stat-row"></div>
  <div class="two-col">
    <section class="card">
      <h2>Fee Balance by Class</h2>
      <div id="fee-by-class" class="table-wrap"></div>
    </section>
    <section class="card">
      <h2>Recent Admissions</h2>
      <div id="recent-admissions" class="table-wrap"></div>
    </section>
  </div>
  <section class="card">
    <div class="card-head-row">
      <div>
        <h2>Top 20 Students with Highest Pending Fee</h2>
        <p class="hint" style="margin:6px 0 0;">Ranked by outstanding balance, highest first.</p>
      </div>
      <span class="tag due">Top 20</span>
    </div>
    <div id="top-pending-fees" class="table-wrap"></div>
  </section>
  <div class="card">
    <h2>Recent Payments</h2>
    <div id="recent-payments" class="table-wrap"></div>
  </div>
</template>

<template id="tpl-students">
  <header class="page-head">
    <div>
      <p class="eyebrow">Register &mdash; Section 02</p>
      <h1>Students</h1>
    </div>
    <button class="btn btn-primary" data-route="add-student">+ Admit Student</button>
  </header>
  <div class="filter-bar">
    <input type="search" id="stu-search" placeholder="Search by name, admission no, guardian, place…" />
    <select id="f-class"><option value="">Class — all</option><option>10</option><option>9</option><option>8</option></select>
    <select id="f-division"><option value="">Division — all</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>M</option></select>
    <select id="f-medium"><option value="">Medium — all</option><option>English</option><option>Malayalam</option></select>
    <select id="f-status"><option value="">Status — all</option><option>Active</option><option value="Pending">Pending balance</option></select>
    <button class="btn btn-ghost" id="export-details">Export Student Details (Excel)</button>
    <button class="btn btn-ghost" id="export-pending">Export Fee Pending (Excel)</button>
  </div>
  <div class="table-wrap" id="students-table"></div>
  <div class="pagination-bar" id="students-pagination"></div>
</template>

<template id="tpl-withdrawn-students">
  <header class="page-head">
    <div>
      <p class="eyebrow">Student Register &mdash; Archive</p>
      <h1>Left / Withdrawn Students</h1>
      <p class="hint">Student profiles, payments and academic records are retained here. Their unpaid balance is kept for historical reference but excluded from active fee-pending reports.</p>
    </div>
    <button class="btn btn-ghost" data-route="students">Back to Active Students</button>
  </header>
  <div class="filter-bar">
    <input type="search" id="withdrawn-search" placeholder="Search by admission no, name, guardian or place…" />
  </div>
  <div class="card">
    <div id="withdrawn-students-table" class="table-wrap"></div>
    <div class="pagination-bar" id="withdrawn-students-pagination"></div>
  </div>
</template>

<template id="tpl-student-detail">
  <header class="page-head">
    <div>
      <p class="eyebrow">Student File</p>
      <h1 id="sd-name">&nbsp;</h1>
    </div>
    <div class="head-actions">
      <button class="btn btn-ghost" id="sd-back">&larr; Back to Students</button>
      <button class="btn btn-ghost" id="sd-reset-parent">Reset Parent Login</button>
      <button class="btn btn-ghost" id="sd-status-action">Move to Left / Withdrawn</button>
      <button class="btn btn-primary" id="sd-edit">Edit Details</button>
      <button class="btn btn-danger" id="sd-delete">Delete Student</button>
    </div>
  </header>
  <div class="two-col">
    <section class="card" id="sd-details"></section>
    <section class="card">
      <div class="card-head-row">
        <h2>Fee Ledger</h2>
        <button class="btn btn-small btn-primary" id="sd-pay">Record Payment</button>
      </div>
      <div id="sd-fee-summary" class="fee-summary"></div>
      <div class="table-wrap" id="sd-payments"></div>
    </section>
  </div>
  <div class="card">
    <div class="card-head-row">
      <h2>Weekly Test Performance</h2>
      <a class="btn btn-small btn-primary" id="sd-performance-report" target="_blank" rel="noopener" style="text-decoration:none;">Performance Report</a>
    </div>
    <div id="sd-weekly-tests" class="table-wrap"></div>
  </div>
  <div class="card">
    <h2>Hot Seat History</h2>
    <div id="sd-hot-seats" class="table-wrap"></div>
  </div>
</template>

<template id="tpl-student-form">
  <header class="page-head">
    <div>
      <p class="eyebrow" id="sf-eyebrow">Register &mdash; Section 03</p>
      <h1 id="sf-title">Admit a Student</h1>
    </div>
  </header>
  <form class="form card" id="student-form">
    <div class="form-grid">
      <label>Admission No. <span class="req">*</span>
        <input type="text" name="admission_no" required />
      </label>
      <label>Joining Date
        <input type="date" name="joining_date" required />
      </label>
      <label>Name of Student <span class="req">*</span>
        <input type="text" name="name" required />
      </label>
      <label>Class <span class="req">*</span>
        <select name="class" required>
          <option value="">Select</option><option>10</option><option>9</option><option>8</option>
        </select>
      </label>
      <label>Division <span class="req">*</span>
        <select name="division" required>
          <option value="">Select</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>M</option>
        </select>
      </label>
      <label>Medium of Instruction <span class="req">*</span>
        <select name="medium" required>
          <option value="">Select</option><option>English</option><option>Malayalam</option>
        </select>
      </label>
      <label>School <span class="req">*</span>
        <select name="school" id="sf-school" required>
          <option value="">Select</option>
          <option>AKM</option><option>IUHSS</option><option>PKMM</option><option>NSS</option>
          <option>FEM</option><option>MALABAR</option><option>NAJATH</option><option>GRHSS</option>
          <option>PMSA</option><option value="Others">Others — specify</option>
        </select>
      </label>
      <label id="sf-school-other-wrap" class="hidden">Specify School
        <input type="text" name="school_other" />
      </label>
      <label>Name of Father
        <input type="text" name="father_name" />
      </label>
      <label>Father's Phone Number
        <input type="tel" name="father_phone" />
      </label>
      <label>Name of Mother
        <input type="text" name="mother_name" />
      </label>
      <label>Mother's Phone Number
        <input type="tel" name="mother_phone" />
      </label>
      <label>Place
        <input type="text" name="place" />
      </label>
      <label>Total Fees <span class="req">*</span>
        <select name="total_fees" required>
          <option value="">Select</option>
          <option value="15900">₹15,900</option>
          <option value="13300">₹13,300</option>
          <option value="10800">₹10,800</option>
        </select>
      </label>
      <label>Discount
        <input type="number" name="discount" min="0" value="0" />
      </label>
      <div class="net-fee-display">
        <span>Net Payable</span>
        <strong id="sf-net-fee">₹0</strong>
      </div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost" data-route="students">Cancel</button>
      <button type="submit" class="btn btn-primary">Save Student</button>
    </div>
  </form>
</template>

<template id="tpl-payment">
  <header class="page-head">
    <div>
      <p class="eyebrow" id="pf-eyebrow">Register &mdash; Section 04</p>
      <h1 id="pf-title">Fee Payment</h1>
    </div>
  </header>
  <form class="form card" id="payment-form">
    <div class="form-grid">
      <label>Admission No. <span class="req">*</span>
        <input type="text" name="admission_no" id="pf-adm" required autocomplete="off" />
      </label>
      <label>Student Name
        <input type="text" id="pf-name" disabled />
      </label>
      <label>Class / Division
        <input type="text" id="pf-class" disabled />
      </label>
      <label>Net Fees
        <input type="text" id="pf-total" disabled />
      </label>
      <label>Already Paid
        <input type="text" id="pf-paid" disabled />
      </label>
      <label>Balance Due
        <input type="text" id="pf-balance" disabled />
      </label>
      <label>Receipt No. <span class="req">*</span>
        <input type="text" name="receipt_no" id="pf-receipt-no" required />
        <span class="field-hint" id="pf-receipt-hint">Suggested from the last saved numeric receipt — your chosen number determines the next suggestion.</span>
      </label>
      <label>Amount <span class="req">*</span>
        <input type="number" name="amount" min="1" required />
      </label>
      <label>Payment Date <span class="req">*</span>
        <input type="date" name="payment_date" required />
      </label>
    </div>
    <div class="form-actions">
      <button type="button" class="btn btn-ghost hidden" id="pf-cancel-edit" data-route="payment-history">Cancel</button>
      <button type="button" class="btn btn-danger hidden" id="pf-delete">Delete Receipt</button>
      <button type="submit" class="btn btn-primary" id="pf-submit">Record Payment</button>
    </div>
  </form>
  <div id="pf-status" class="status-banner hidden"></div>
</template>

<template id="tpl-fee-pending-slips">
  <header class="page-head">
    <div>
      <p class="eyebrow">Fee Management</p>
      <h1>Fee Pending Slip Generation</h1>
      <p class="hint">Create printable Malayalam fee reminders for active students in a selected class and division.</p>
    </div>
  </header>
  <section class="card">
    <h2>Slip Settings</h2>
    <div class="form-grid form-grid-narrow fee-slip-settings">
      <label>Class <span class="req">*</span>
        <select id="fps-class"><option value="">Select Class</option></select>
      </label>
      <label>Division <span class="req">*</span>
        <select id="fps-division" disabled><option value="">Select Division</option></select>
      </label>
      <label>Cumulative Paid Target per Student (₹) <span class="req">*</span>
        <input type="number" id="fps-target" min="0.01" step="0.01" placeholder="e.g. 2000" />
        <span class="field-hint">The total amount you want each student to have paid by the due date. The slip requests the difference between this target and the amount already paid, limited to the student's actual outstanding fee.</span>
      </label>
      <label>Due Date <span class="req">*</span>
        <input type="date" id="fps-due-date" />
      </label>
    </div>
    <div class="form-actions" style="justify-content:flex-start;">
      <button class="btn btn-primary" id="fps-preview">Generate Slips</button>
      <button class="btn btn-ghost" id="fps-reset" type="button">Reset</button>
    </div>
    <p class="hint">Only active students who have not yet reached the cumulative paid target and still have an outstanding fee are included. The requested amount is Target − Already Paid, limited to the actual outstanding fee. Withdrawn students are excluded. Generating slips does not record a payment or change the fee ledger.</p>
    <div id="fps-status" aria-live="polite"></div>
  </section>
  <section class="card hidden" id="fps-results-card">
    <div class="card-head-row">
      <div>
        <h2>Generated Fee Pending Slips</h2>
        <p class="hint" style="margin:6px 0 0;">Review the list before printing. Four Malayalam slips are arranged per A4 page (2 × 2).</p>
      </div>
      <button class="btn btn-primary" id="fps-print">Print All Slips</button>
    </div>
    <div id="fps-summary" class="fee-summary"></div>
    <div id="fps-results-table" class="table-wrap"></div>
  </section>
</template>

<template id="tpl-payment-history">
  <header class="page-head">
    <div>
      <p class="eyebrow">Register &mdash; Section 05</p>
      <h1>Payment History</h1>
    </div>
  </header>
  <div class="filter-bar">
    <input type="search" id="ph-search" placeholder="Search by admission no, name or receipt no…" />
  </div>
  <div class="table-wrap" id="ph-table"></div>
  <div class="pagination-bar" id="ph-pagination"></div>
</template>

<template id="tpl-classes">
  <header class="page-head">
    <div>
      <p class="eyebrow">Register &mdash; Section 06</p>
      <h1>Classes &amp; Divisions</h1>
    </div>
  </header>
  <div class="two-col">
    <section class="card">
      <h2>Add Class</h2>
      <form class="form" id="class-form">
        <div class="form-grid form-grid-narrow">
          <label>Class <span class="req">*</span>
            <select name="class" required><option value="">Select</option><option>10</option><option>9</option><option>8</option></select>
          </label>
          <label>Division <span class="req">*</span>
            <select name="division" required><option value="">Select</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>M</option></select>
          </label>
          <label>Medium <span class="req">*</span>
            <select name="medium" required><option value="">Select</option><option>English</option><option>Malayalam</option></select>
          </label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add Class</button>
        </div>
      </form>
    </section>
    <section class="card">
      <h2>Existing Classes</h2>
      <div class="table-wrap" id="classes-table"></div>
    </section>
  </div>
</template>

<template id="tpl-teachers">
  <header class="page-head">
    <div>
      <p class="eyebrow">Register &mdash; Section 07</p>
      <h1>Teachers</h1>
    </div>
  </header>
  <div class="two-col">
    <section class="card">
      <h2 id="tf-title">Add Teacher</h2>
      <form class="form" id="teacher-form">
        <input type="hidden" name="id" />
        <div class="form-grid form-grid-narrow">
          <label>Name <span class="req">*</span>
            <input type="text" name="name" required />
          </label>
          <label>Classes Handled
            <input type="text" name="classes_handled" placeholder="e.g. 10 A, 10 B, 9 C" />
          </label>
          <label>Subject
            <input type="text" name="subject" placeholder="e.g. Mathematics" />
          </label>
          <label>Hour Rate (₹) <span class="req">*</span>
            <input type="number" name="hour_rate" min="0" required />
          </label>
          <label>Phone Number
            <input type="tel" name="phone" />
          </label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost hidden" id="tf-cancel">Cancel Edit</button>
          <button type="submit" class="btn btn-primary" id="tf-submit">Add Teacher</button>
        </div>
      </form>
    </section>
    <section class="card">
      <h2>Faculty &amp; Worklog</h2>
      <div class="table-wrap" id="teachers-table"></div>
    </section>
  </div>
</template>

<template id="tpl-timetable">
  <header class="page-head">
    <div>
      <p class="eyebrow">Register &mdash; Section 08</p>
      <h1>Timetable</h1>
    </div>
  </header>

  <section class="card">
    <div class="card-head-row">
      <h2>Weekly Grid</h2>
      <div class="tt-grid-toolbar">
        <button type="button" class="btn btn-small btn-ghost" id="tt-prev-day">&larr;</button>
        <input type="date" id="tt-grid-date" />
        <button type="button" class="btn btn-small btn-ghost" id="tt-next-day">&rarr;</button>
        <span class="tt-daylabel" id="tt-daylabel"></span>
      </div>
    </div>
    <div class="tt-grid-wrap" id="tt-grid"></div>
  </section>

  <div class="two-col">
    <section class="card">
      <h2>Add Timetable Entry</h2>
      <form class="form" id="timetable-form">
        <div class="form-grid form-grid-narrow">
          <label>Date <span class="req">*</span>
            <input type="date" name="date" required />
          </label>
          <label>Start Time <span class="req">*</span>
            <input type="time" name="start_time" required />
          </label>
          <label>End Time <span class="req">*</span>
            <input type="time" name="end_time" required />
          </label>
          <label>Class &amp; Division <span class="req">*</span>
            <select id="tt-class-division" required>
              <option value="">Select</option>
            </select>
          </label>
          <label>Subject
            <input type="text" name="subject" />
          </label>
          <label>Teacher <span class="req">*</span>
            <select name="teacher_id" id="tt-teacher" required>
              <option value="">Select teacher</option>
              <option value="new">+ Add new teacher…</option>
            </select>
          </label>
        </div>
        <div id="tt-new-teacher" class="form-grid form-grid-narrow hidden">
          <label>New Teacher Name <span class="req">*</span>
            <input type="text" name="new_teacher_name" />
          </label>
          <label>Subject
            <input type="text" name="new_teacher_subject" />
          </label>
          <label>Hour Rate (₹)
            <input type="number" name="new_teacher_hour_rate" min="0" />
          </label>
          <label>Phone Number
            <input type="tel" name="new_teacher_phone" />
          </label>
        </div>
        <p class="hint">Hours are calculated automatically from start &amp; end time and logged straight to the teacher's worklog. Add classes on the Classes page first so they appear here.</p>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add to Timetable</button>
        </div>
      </form>
    </section>
    <section class="card">
      <div class="card-head-row">
        <h2>Scheduled Classes (list)</h2>
        <input type="date" id="tt-filter-date" />
      </div>
      <div class="table-wrap" id="timetable-table"></div>
    </section>
  </div>
</template>

<template id="tpl-mark-entry">
  <header class="page-head me-page-head">
    <div class="me-page-title">
      <p class="eyebrow">Academic Records &mdash; Quick Entry</p>
      <h1>Mark Entry</h1>
      <p class="me-page-intro">Set up a Weekly Test, then enter marks one student at a time. Press <kbd>Enter</kbd> after the Admission Number and again after the mark.</p>
    </div>
    <button class="btn btn-ghost" data-route="weekly-tests">View Weekly Tests <span aria-hidden="true">→</span></button>
  </header>

  <div class="me-workflow-steps" aria-label="Mark entry steps">
    <div class="me-workflow-step is-current"><span>01</span><div><strong>Test details</strong><small>Set date, class and topic</small></div></div>
    <div class="me-workflow-connector"></div>
    <div class="me-workflow-step"><span>02</span><div><strong>Enter marks</strong><small>Admission No. → Mark</small></div></div>
    <div class="me-workflow-connector"></div>
    <div class="me-workflow-step"><span>03</span><div><strong>Finish &amp; export</strong><small>Review the marklist</small></div></div>
  </div>

  <section class="card me-card me-setup-card">
    <div class="me-card-heading">
      <span class="me-step-number">01</span>
      <div><h2>Test Details</h2><p>Enter these details once. They will be saved in the Weekly Tests register.</p></div>
    </div>
    <div class="me-meta-grid" id="me-meta-form">
      <label class="me-field">Test Date <span class="req">*</span>
        <input type="date" id="me-date" required />
      </label>
      <label class="me-field">Class <span class="req">*</span>
        <select id="me-class" required><option value="">Select class</option></select>
      </label>
      <label class="me-field">Maximum Marks
        <input type="number" id="me-max-marks" min="0.5" max="1000" step="0.5" value="20" required />

        <input type="text" id="me-subject" placeholder="e.g. Mathematics" required />
      </label>
      <label class="me-field me-field-wide">Topic <span class="req">*</span>
        <input type="text" id="me-topic" placeholder="e.g. Quadratic Equations" required />
      </label>
    </div>
    <div class="me-setup-footer">
      <button class="btn btn-primary me-start-btn" id="me-load-session"><span aria-hidden="true">▶</span> Start / Resume Mark Entry</button>
      <p class="me-status-text" id="me-session-status">Select the test details to begin.</p>
    </div>
  </section>

  <section class="card me-card me-entry-card" id="me-entry-card" style="opacity:.65;">
    <div class="me-entry-card-top">
      <div class="me-card-heading">
        <span class="me-step-number me-step-teal">02</span>
        <div><h2>Enter Student Marks</h2><p>Fast keyboard entry &mdash; no need to click between students.</p></div>
      </div>
      <div class="me-entry-mode"><span class="me-live-dot"></span> Live entry</div>
    </div>
    <div class="me-entry-form">
      <label class="me-field me-admission-field">Admission Number <span class="req">*</span>
        <div class="me-input-with-icon"><span aria-hidden="true">⌕</span><input type="text" id="me-admission" placeholder="Type Admission Number" autocomplete="off" enterkeyhint="go" disabled /></div>
        <small class="me-field-note" id="me-admission-hint">Type the Admission Number and press Enter.</small>
      </label>
      <div class="me-entry-arrow" aria-hidden="true">→</div>
      <label class="me-field me-mark-field">Mark <span class="req">*</span>
        <div class="me-mark-input-wrap"><input type="number" id="me-mark" min="0" step="0.5" placeholder="0" enterkeyhint="done" disabled /><span id="me-mark-max-label">/ 20</span></div>
        <small class="me-field-note">Press Enter to save and load the next student.</small>
      </label>
    </div>
    <div id="me-student-matches" class="me-student-matches" aria-live="polite"></div>
    <div id="me-selected-student" class="me-selected-student hidden"></div>
    <div class="me-entry-footer">
      <div class="me-entry-actions">
        <button class="btn btn-primary me-save-btn" id="me-save-mark" disabled>Save Mark <kbd>Enter</kbd></button>
        <button class="btn btn-ghost" id="me-clear-student" disabled>Clear</button>
        <button class="btn btn-finish" id="me-finish-entry" disabled>Finish Entry <span aria-hidden="true">✓</span></button>
      </div>
      <p class="me-status-text" id="me-save-status">Start a test session to enable mark entry.</p>
    </div>
    <div class="me-keyboard-guide"><span><kbd>Enter</kbd> after Admission No.</span><span class="me-guide-arrow">→</span><span><kbd>Enter</kbd> after Mark</span><span class="me-guide-arrow">→</span><strong>Next student loads automatically</strong></div>
  </section>

  <section class="card me-card me-marklist-card">
    <div class="me-marklist-header">
      <div class="me-card-heading">
        <span class="me-step-number me-step-muted">03</span>
        <div><h2>Weekly Test Marklist</h2><p id="me-mark-count">No test selected.</p></div>
      </div>
      <button class="btn btn-export" id="me-export" disabled><span aria-hidden="true">↓</span> Export Excel</button>
    </div>
    <div class="table-wrap" id="me-marklist"></div>
  </section>
</template>

<template id="tpl-hot-seat">
  <header class="page-head">
    <div>
      <p class="eyebrow">Register &mdash; Section 11</p>
      <h1>Hot Seat</h1>
    </div>
  </header>
  <p class="hint" style="margin-bottom:20px;">A quick per-session observation log — how a student did when put on the spot in class: engagement, preparedness, and any notes for parents.</p>

    <h2 id="hs-form-title">Add Hot Seat Record</h2>
    <form class="form" id="hot-seat-form">
      <input type="hidden" name="id" />
      <div class="form-grid form-grid-narrow">
        <label>Admission No. <span class="req">*</span>
          <input type="text" id="hs-adm" name="admission_no" required autocomplete="off" />
        </label>
        <label>Student Name
          <input type="text" id="hs-name" disabled />
        </label>
        <label>Class &amp; Division
          <input type="text" id="hs-class" disabled />
        </label>
        <label>School
          <input type="text" id="hs-school" disabled />
        </label>
        <label>Date <span class="req">*</span>
          <input type="date" name="date" required />
        </label>
        <label>Subject
          <input type="text" name="subject" />
        </label>
        <label>Teacher
          <input type="text" name="teacher" placeholder="e.g. SN" />

        <label>Performance

            <option>Excellent</option>
            <option>Very Good</option>

<template id="tpl-import">
  <header class="page-head">
    <div>
      <p class="eyebrow">Register &mdash; Section 12</p>
      <h1>Import Data</h1>
    </div>
  </header>
  <p class="hint" style="margin-bottom:20px;">Bring in your existing spreadsheets. Each importer accepts your own file formats where possible — download a sample below if you'd like a template to match, upload your Excel file, and we'll report exactly what was added, updated, or needs a fix.</p>

  <div class="two-col">
    <section class="card">
      <h2>Import Students</h2>
      <p class="hint" style="margin:0 0 14px;">Matched by Admission No — re-uploading updates existing students instead of duplicating them.</p>
      <div class="import-actions">
        <a href="/templates/students-import-template.xlsx" download class="btn btn-ghost btn-small">Download Sample</a>
        <label class="btn btn-primary btn-small file-btn">
          Choose Excel File
          <input type="file" id="import-students-file" accept=".xlsx,.xls" class="hidden" />
        </label>
        <span class="import-filename" id="import-students-filename"></span>
      </div>
      <button class="btn btn-primary" id="import-students-submit" style="margin-top:14px;" disabled>Upload &amp; Import</button>
      <div id="import-students-result"></div>
    </section>

    <section class="card">
      <h2>Update Student Divisions</h2>
      <p class="hint" style="margin:0 0 14px;">Update only the division of existing students by matching Admission No. Use this when students move between divisions during the academic year. Student details, fee records, marks and other information will not be changed. Left / Withdrawn students are skipped.</p>
      <div class="import-actions">
        <a href="/templates/division-update-template.xlsx" download class="btn btn-ghost btn-small">Download Sample</a>
        <label class="btn btn-primary btn-small file-btn">
          Choose Excel File
          <input type="file" id="import-divisions-file" accept=".xlsx,.xls" class="hidden" />
        </label>
        <span class="import-filename" id="import-divisions-filename"></span>
      </div>
      <button class="btn btn-primary" id="import-divisions-submit" style="margin-top:14px;" disabled>Upload &amp; Update Divisions</button>
      <div id="import-divisions-result"></div>
    </section>

    <section class="card">
      <h2>Import Teachers</h2>
      <p class="hint" style="margin:0 0 14px;">Matched by Name (case-insensitive) — re-uploading updates existing teachers instead of duplicating them.</p>
      <div class="import-actions">
        <a href="/templates/teachers-import-template.xlsx" download class="btn btn-ghost btn-small">Download Sample</a>
        <label class="btn btn-primary btn-small file-btn">
          Choose Excel File
          <input type="file" id="import-teachers-file" accept=".xlsx,.xls" class="hidden" />
        </label>
        <span class="import-filename" id="import-teachers-filename"></span>
      </div>
      <button class="btn btn-primary" id="import-teachers-submit" style="margin-top:14px;" disabled>Upload &amp; Import</button>
      <div id="import-teachers-result"></div>
    </section>
  </div>

  <section class="card">
    <h2>Import Teacher Timetable</h2>
    <p class="hint" style="margin:0 0 14px;">Add teachers first — cells are matched to teachers by their initials (e.g. "Maths SF" → Sarah Fernandez). Re-uploading updates matching entries (same date, time, class &amp; division) instead of duplicating them.</p>
    <div class="import-actions">
      <a href="/templates/timetable-import-template.xlsx" download class="btn btn-ghost btn-small">Download Sample</a>
      <label class="btn btn-primary btn-small file-btn">
        Choose Excel File
        <input type="file" id="import-timetable-file" accept=".xlsx,.xls" class="hidden" />
      </label>
      <span class="import-filename" id="import-timetable-filename"></span>
    </div>
    <button class="btn btn-primary" id="import-timetable-submit" style="margin-top:14px;" disabled>Upload &amp; Import</button>
    <div id="import-timetable-result"></div>
  </section>

  <section class="card">
    <h2>Import Fee Balances</h2>
    <p class="hint" style="margin:0 0 14px;">Sets each student's Total Fee &amp; Discount, then tops up their recorded payments to match the sheet's "Paid" figure with one reconciling entry per student (receipt "OB-&lt;admission no&gt;"). Safe to re-run — it only adjusts the shortfall.</p>
    <div class="import-actions">
      <a href="/templates/fees-import-template.xlsx" download class="btn btn-ghost btn-small">Download Sample</a>
      <label class="btn btn-primary btn-small file-btn">
        Choose Excel File
        <input type="file" id="import-fees-file" accept=".xlsx,.xls" class="hidden" />
      </label>
      <span class="import-filename" id="import-fees-filename"></span>
    </div>
    <button class="btn btn-primary" id="import-fees-submit" style="margin-top:14px;" disabled>Upload &amp; Import</button>
    <div id="import-fees-result"></div>
  </section>

  <section class="card">
    <h2>Import Weekly Test Marks</h2>
    <p class="hint" style="margin:0 0 14px;">Columns: Admission No, Name, Exam, Mark (numeric, or "AB" for absent). Since the sheet doesn't carry a date, set the test date below before uploading. Re-uploading the same exam &amp; date updates marks instead of duplicating the test.</p>
    <div class="form-grid form-grid-narrow" style="margin-bottom:14px;max-width:420px;">
      <label>Test Date <span class="req">*</span>
        <input type="date" id="wt-import-date" />
      </label>
      <label>Max Marks
        <input type="number" id="wt-import-maxmarks" value="20" min="1" />
      </label>
    </div>
    <div class="import-actions">
      <a href="/templates/weekly-test-import-template.xlsx" download class="btn btn-ghost btn-small">Download Sample</a>
      <label class="btn btn-primary btn-small file-btn">
        Choose Excel File
        <input type="file" id="import-weeklytest-file" accept=".xlsx,.xls" class="hidden" />
      </label>
      <span class="import-filename" id="import-weeklytest-filename"></span>
    </div>
    <button class="btn btn-primary" id="import-weeklytest-submit" style="margin-top:14px;" disabled>Upload &amp; Import</button>
    <div id="import-weeklytest-result"></div>
  </section>

  <section class="card">
    <h2>Import Term Exam Marks</h2>
    <p class="hint" style="margin:0 0 14px;">Upload a marklist workbook with one sheet per class/division (e.g. "10 A", "10 B") — each sheet's header row should have Adm No, Name, Class, then one column per subject. Marks are numbers, or "AB" for absent; leave a cell blank if that subject doesn't apply to a student. Max marks per subject aren't in the sheet, so they're detected automatically from the highest score seen (rounded to a standard total like 40, 50, 80, or 100) — the result after upload shows what was detected. Re-uploading the same exam name, class, and date updates marks instead of duplicating.</p>
    <div class="form-grid form-grid-narrow" style="margin-bottom:14px;max-width:420px;">
      <label>Exam Name
        <input type="text" id="te-import-name" value="Term Examination" />
      </label>
      <label>Exam Date <span class="req">*</span>
        <input type="date" id="te-import-date" />
      </label>
    </div>
    <div class="import-actions">
      <a href="/templates/term-exam-import-template.xlsx" download class="btn btn-ghost btn-small">Download Sample</a>
      <label class="btn btn-primary btn-small file-btn">
        Choose Excel File
        <input type="file" id="import-termexam-file" accept=".xlsx,.xls" class="hidden" />
      </label>
      <span class="import-filename" id="import-termexam-filename"></span>
    </div>
    <button class="btn btn-primary" id="import-termexam-submit" style="margin-top:14px;" disabled>Upload &amp; Import</button>
    <div id="import-termexam-result"></div>
  </section>
</template>

<div id="fee-slip-print" aria-hidden="true"></div>
